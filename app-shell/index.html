<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trove</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: #f2f0eb; color: #1c1f26; font: 17px/1.4 -apple-system, system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) { html, body { background: #111316; color: #ecebe5; } }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
      button { margin-top: 8px; border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 600; background: #1e2b47; color: #fff; }
    </style>
  </head>
  <body>
    <!-- Shown only when Trove can't be reached (no connection): the app itself is the live site. -->
    <main>
      <strong>Trove can’t connect right now.</strong>
      <span>Check your connection and try again.</span>
      <button onclick="location.href = 'https://mytrove.me'">Try again</button>
    </main>
  </body>
</html>
